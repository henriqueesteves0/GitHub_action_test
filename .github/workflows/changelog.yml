name: Changelog

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo
            echo "Gerado automaticamente em $(date +'%d/%m/%Y %H:%M')"
            echo
            git log --pretty=format:"- %ad | %s (%an) [%h]" --date=short
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Enviar CHANGELOG.md para o repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "Sem alterações no changelog." && exit 0
          git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push
